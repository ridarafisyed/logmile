name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

env:
  PROJECT_ID: backend-services-499808
  REGION: us-central1
  ARTIFACT_REPO: backend-images
  SERVICE_NAME: log-mile-backend
  IMAGE_NAME: log-mile-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME:${{ github.sha }} \
            ./backend

      - name: Push image
        run: |
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "ALLOWED_HOSTS=${{ secrets.ALLOWED_HOSTS }}" \
            --set-env-vars "CORS_ALLOWED_ORIGINS=${{ secrets.CORS_ALLOWED_ORIGINS }}" \
            --set-env-vars "CSRF_TRUSTED_ORIGINS=${{ secrets.CSRF_TRUSTED_ORIGINS }}" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "DJANGO_CACHE_DEFAULT_TIMEOUT=${{ secrets.DJANGO_CACHE_DEFAULT_TIMEOUT }}" \
            --set-env-vars "DJANGO_DB_CONN_MAX_AGE=${{ secrets.DJANGO_DB_CONN_MAX_AGE }}" \
            --set-env-vars "DJANGO_DEBUG=${{ secrets.DJANGO_DEBUG }}" \
            --set-env-vars "DJANGO_SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }}" \
            --set-env-vars "GUNICORN_THREADS=${{ secrets.GUNICORN_THREADS }}" \
            --set-env-vars "GUNICORN_TIMEOUT=${{ secrets.GUNICORN_TIMEOUT }}" \
            --set-env-vars "GUNICORN_WORKERS=${{ secrets.GUNICORN_WORKERS }}" \
            --set-env-vars "MAPS_CACHE_TTL_SECONDS=${{ secrets.MAPS_CACHE_TTL_SECONDS }}" \
            --set-env-vars "OPENROUTESERVICE_API_KEY=${{ secrets.OPENROUTESERVICE_API_KEY }}" \
            --set-env-vars "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" \
            --set-env-vars "POSTGRES_HOST=${{ secrets.POSTGRES_HOST }}" \
            --set-env-vars "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" \
            --set-env-vars "POSTGRES_PORT=${{ secrets.POSTGRES_PORT }}" \
            --set-env-vars "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" \
            --set-env-vars "REDIS_URL=${{ secrets.REDIS_URL }}" \
            --set-env-vars "TRIP_PLAN_BURST_RATE=${{ secrets.TRIP_PLAN_BURST_RATE }}" \
            --set-env-vars "TRIP_PLAN_SUSTAINED_RATE=${{ secrets.TRIP_PLAN_SUSTAINED_RATE }}" \
            --set-env-vars "VITE_DEV_API_PROXY_TARGET=${{ secrets.VITE_DEV_API_PROXY_TARGET }}"