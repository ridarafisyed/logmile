name: Deploy Backend to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

env:
  PROJECT_ID: backend-services-499808
  REGION: us-central1
  ARTIFACT_REPO: backend-images
  SERVICE_NAME: log-mile-backend
  IMAGE_NAME: log-mile-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker us-central1-docker.pkg.dev --quiet

      - name: Build image
        run: |
          docker build \
            -t us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME:${{ github.sha }} \
            ./backend

      - name: Push image
        run: |
          docker push us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME:${{ github.sha }}

      - name: Create Cloud Run env file
        run: |
          cat > env.yaml <<EOF
          ALLOWED_HOSTS: "${{ secrets.ALLOWED_HOSTS }}"
          CORS_ALLOWED_ORIGINS: "${{ secrets.CORS_ALLOWED_ORIGINS }}"
          CSRF_TRUSTED_ORIGINS: "${{ secrets.CSRF_TRUSTED_ORIGINS }}"
          DATABASE_URL: "${{ secrets.DATABASE_URL }}"
          DJANGO_CACHE_DEFAULT_TIMEOUT: "${{ secrets.DJANGO_CACHE_DEFAULT_TIMEOUT }}"
          DJANGO_DB_CONN_MAX_AGE: "${{ secrets.DJANGO_DB_CONN_MAX_AGE }}"
          DJANGO_DEBUG: "${{ secrets.DJANGO_DEBUG }}"
          DJANGO_SECRET_KEY: "${{ secrets.DJANGO_SECRET_KEY }}"
          GUNICORN_THREADS: "${{ secrets.GUNICORN_THREADS }}"
          GUNICORN_TIMEOUT: "${{ secrets.GUNICORN_TIMEOUT }}"
          GUNICORN_WORKERS: "${{ secrets.GUNICORN_WORKERS }}"
          MAPS_CACHE_TTL_SECONDS: "${{ secrets.MAPS_CACHE_TTL_SECONDS }}"
          OPENROUTESERVICE_API_KEY: "${{ secrets.OPENROUTESERVICE_API_KEY }}"
          POSTGRES_DB: "${{ secrets.POSTGRES_DB }}"
          POSTGRES_HOST: "${{ secrets.POSTGRES_HOST }}"
          POSTGRES_PASSWORD: "${{ secrets.POSTGRES_PASSWORD }}"
          POSTGRES_PORT: "${{ secrets.POSTGRES_PORT }}"
          POSTGRES_USER: "${{ secrets.POSTGRES_USER }}"
          REDIS_URL: "${{ secrets.REDIS_URL }}"
          TRIP_PLAN_BURST_RATE: "${{ secrets.TRIP_PLAN_BURST_RATE }}"
          TRIP_PLAN_SUSTAINED_RATE: "${{ secrets.TRIP_PLAN_SUSTAINED_RATE }}"
          VITE_DEV_API_PROXY_TARGET: "${{ secrets.VITE_DEV_API_PROXY_TARGET }}"
          EOF

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image us-central1-docker.pkg.dev/$PROJECT_ID/$ARTIFACT_REPO/$IMAGE_NAME:${{ github.sha }} \
            --region $REGION \
            --platform managed \
            --allow-unauthenticated \
            --port 8080 \
            --env-vars-file env.yaml